spring.application.name=buyme
spring.config.import=optional:file:.env[.properties]

server.port=9090

spring.mongodb.uri=mongodb://localhost:27017/buyme_db

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

api.prefix=/api/v1

app.use-secure-cookie=false

## 1 min
#auth.token.access-expiration-in-mils=60000
## 3 days
#auth.token.refresh-expiration-in-mils=300000000

## 10 hrs
auth.token.access-expiration-in-mils=36000000
## 30 days
auth.token.refresh-expiration-in-mils=2592000000

auth.token.secret=${JWT_SECRET_KEY}

spring.output.ansi.enabled=ALWAYS

### stripe section
stripe.secret.key=${STRIPE_SECRET_KEY}

### openai section
spring.ai.openai.api-key=${OPEN_AI_KEY}
# OpenAI HTTP client timeouts (in milliseconds)
spring.ai.openai.client.connect-timeout=2000
spring.ai.openai.client.read-timeout=15000

#### chroma section
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.collection-name=image_collection
spring.ai.vectorstore.chroma.initialize-schema=true
spring.ai.vectorstore.chroma.tenant-name=default_tenant
spring.ai.vectorstore.chroma.database-name=default_database
# Chroma HTTP client timeouts (in milliseconds)
spring.ai.vectorstore.chroma.client.connect-timeout=1000
spring.ai.vectorstore.chroma.client.read-timeout=5000