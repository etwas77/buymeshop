services:
  chroma:
    image: ghcr.io/chroma-core/chroma:1.0.0
    container_name: chroma-vector-db
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=true
      - CHROMA_DB_IMPL=duckdb
      - PERSIST_DIRECTORY=/chroma/data
    volumes:
      - chroma_data:/chroma/data
    restart: unless-stopped
volumes:
  chroma_data:
    driver: local
